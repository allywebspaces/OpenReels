name: FREE English pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/free-pilot.yml']
permissions:
  contents: read
concurrency:
  group: openreels-free-pilot
  cancel-in-progress: false
jobs:
  free-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verified free build
        uses: actions/checkout@v4
        with:
          ref: 558c0263911e9f578adf2c21a3a29a02d90d4555
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - name: Install CPU dependencies
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: pnpm install --frozen-lockfile
      - name: Check free English policy and types
        run: |
          node --test src/free-pilot/policy.test.mjs src/free-pilot/speech.test.mjs
          node scripts/free-pilot.mjs --preset micro-drama --check
          pnpm exec tsc --noEmit
      - name: Install media verification tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render using local Kokoro and template graphics
        run: node scripts/free-pilot.mjs --preset micro-drama
      - name: Verify MP4
        run: |
          test -s output/micro-drama/pilot.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration -of json output/micro-drama/pilot.mp4
      - name: Save free pilot for review
        uses: actions/upload-artifact@v4
        with:
          name: free-english-pilot-${{ github.run_id }}
          path: |
            output/micro-drama/pilot.mp4
            output/micro-drama/question-revised.mp3
            output/micro-drama/preview.png
            output/micro-drama/review-scene-*.png
            output/micro-drama/pilot.json
            output/micro-drama/report.json
            output/micro-drama/comparison-calm.wav
            output/micro-drama/comparison-energetic.wav
            output/micro-drama/comparison-calm.mp3
            output/micro-drama/comparison-energetic.mp3
          retention-days: 7
          if-no-files-found: error
      - name: Result
        run: |
          echo 'Free English pilot: local Kokoro voice, original graphics, scene captions. No paid APIs or secrets used.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the artifact to review the MP4. No social publishing is configured.' >> "$GITHUB_STEP_SUMMARY"
